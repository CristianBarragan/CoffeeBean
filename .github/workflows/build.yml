name: Build & Test

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore Foundgine.sln

      - name: Build
        run: dotnet build Foundgine.sln --no-restore --configuration Release

      - name: Test
        run: dotnet test Foundgine.sln --no-build --configuration Release --verbosity normal

  postgres-e2e:
    name: PostgreSQL 17 E2E
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "9.0.x"

      - name: Restore
        run: dotnet restore Foundgine.sln

      - name: Build
        run: dotnet build Foundgine.sln --no-restore --configuration Release

      - name: Start PostgreSQL 17
        run: docker compose -f docker-compose.postgres.yml up -d --wait postgres

      - name: Verify PostgreSQL 17
        run: |
          docker compose -f docker-compose.postgres.yml exec -T postgres \
            psql -U foundgine -d foundgine_e2e -c 'select version();'

      - name: Run PostgreSQL E2E
        #env:
          #FOUNDGINE_POSTGRES_CONNECTION_STRING: Host=localhost;Port=55432;Database=foundgine_e2e;Username=foundgine;Password=foundgine
        run: >-
          dotnet test tests/Foundgine.E2E.Tests/Foundgine.E2E.Tests.csproj
          --no-build
          --configuration Release
          --filter "FullyQualifiedName~Foundgine.E2E.Tests"
          --logger "console;verbosity=normal"

      - name: PostgreSQL diagnostics on failure
        if: failure()
        run: docker compose -f docker-compose.postgres.yml logs --no-color postgres

      - name: Stop PostgreSQL
        if: always()
        run: docker compose -f docker-compose.postgres.yml down --volumes --remove-orphans
