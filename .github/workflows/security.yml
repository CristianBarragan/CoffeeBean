name: Security

on:
  push:
    branches:
      - main
    tags:
      - v*
  pull_request:
    branches:
      - main
  schedule:
    - cron: '0 6 * * 1'   # weekly Monday 06:00 UTC — catches newly-disclosed CVEs
  workflow_dispatch: {}     # allow manual trigger from the Actions tab

permissions:
  contents: read

jobs:

  # ============================================================
  # NuGet dependency vulnerability scan
  # Free, built into the .NET SDK — no third-party account needed.
  # Runs on every push/PR plus the weekly schedule.
  # ============================================================
  dependency-audit:
    name: NuGet Vulnerability Audit
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      # ------------------------------------------------------------
      # The actual gate: restore-time NuGetAudit warnings (NU1901-NU1904).
      # This is the mechanism NuGetAuditSuppress is documented to affect —
      # per-advisory suppressions added to a .csproj (with justification)
      # will correctly clear here. `dotnet list package --vulnerable`
      # below is kept as an informational report only; whether it honors
      # NuGetAuditSuppress is not clearly documented, so it must not gate.
      # ------------------------------------------------------------
      - name: Restore with full audit mode
        id: audit_restore
        shell: bash
        run: |
          set -euo pipefail

          echo "Restoring with NuGetAuditMode=all (checks transitive packages too)..."
          output="$(dotnet restore Foundgine.sln -p:NuGetAuditMode=all 2>&1)" || true
          echo "$output"

          if echo "$output" | grep -qE "warning NU190[1-4]"; then
            echo
            echo "ERROR: Unsuppressed vulnerability warnings (NU1901-NU1904) detected."
            echo "Either upgrade the affected package, or add a justified"
            echo "<NuGetAuditSuppress Include=\"<advisory-url>\" /> entry to the"
            echo "affected project — see Foundgine.E2E.Tests.csproj for an example."
            exit 1
          fi

          echo
          echo "OK: no unsuppressed vulnerability warnings."

      - name: Informational — vulnerable package report
        shell: bash
        run: |
          set -euo pipefail
          echo "Full vulnerable-package report (informational; suppressions may not apply here):"
          dotnet list Foundgine.sln package --vulnerable --include-transitive || true

      - name: Check for deprecated packages
        shell: bash
        run: |
          set -euo pipefail
          dotnet list Foundgine.sln package --deprecated --include-transitive || true

  # ============================================================
  # Secret scanning — catches committed credentials/keys/tokens.
  # ============================================================
  secret-scan:
    name: Secret Scan (gitleaks)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  # ============================================================
  # Software Bill of Materials (CycloneDX)
  # Evidence to hand a paid auditor or an OSTIF/Sovereign-Tech-Fund
  # application later — "here is exactly what's in the supply chain."
  # ============================================================
  sbom:
    name: Generate SBOM
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Restore
        run: dotnet restore Foundgine.sln

      - name: Install CycloneDX SBOM tool
        run: dotnet tool install --global CycloneDX

      - name: Generate SBOM
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p artifacts/sbom
          export PATH="$PATH:$HOME/.dotnet/tools"
          dotnet-CycloneDX Foundgine.sln -o artifacts/sbom -F Json -fn foundgine-sbom.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: artifacts/sbom/*
          if-no-files-found: error

  # ============================================================
  # OWASP ZAP baseline scan — dynamic scan of the running SupplyChain
  # sample. Slow, so it's restricted to the weekly schedule or a
  # manual run rather than firing on every push/PR.
  # ============================================================
  zap-baseline:
    name: Dynamic Scan — SupplyChain Sample
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 9.0.x

      - name: Start PostgreSQL + SupplyChain API
        run: |
          cd samples/Foundgine.SupplyChain
          docker compose up -d --build

      - name: Wait for API readiness
        run: |
          for i in $(seq 1 30); do
            if curl -sf http://localhost:4422/health/ready; then
              echo "API ready"
              exit 0
            fi
            sleep 2
          done
          echo "API did not become ready in time" >&2
          exit 1

      - name: MCP protocol security fuzzing
        shell: pwsh
        env:
          FOUNDGINE_TARGET_URL: http://localhost:4422/mcp
        run: ./security/pentest/mcp-protocol-fuzz.ps1

      # Passive scan only (no active exploit attempts) — safe to run
      # against a real endpoint without risking state. The repository MCP
      # protocol corpus has already run immediately above; MCP Inspector can
      # be used for deeper interactive protocol coverage.
      #
      # allow_issue_writing is disabled because this workflow only grants
      # `permissions: contents: read` at the top level — the action would
      # otherwise try to open a GitHub issue with the findings and fail
      # with "403 Resource not accessible by integration". Findings are
      # already delivered via the uploaded HTML report artifact below.
      - name: ZAP Baseline Scan
        uses: zaproxy/action-baseline@v0.15.0
        with:
          target: 'http://localhost:4422'
          fail_action: false   # start in report-only mode; flip to true once triaged
          cmd_options: '-a'
          allow_issue_writing: false

      - name: Upload ZAP report
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: zap-baseline-report
          path: report_html.html

      - name: Stop stack
        if: always()
        run: |
          cd samples/Foundgine.SupplyChain
          docker compose down --volumes --remove-orphans
