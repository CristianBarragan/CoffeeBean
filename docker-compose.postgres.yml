services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: foundgine_e2e
      POSTGRES_USER: foundgine
      POSTGRES_PASSWORD: foundgine
    ports:
      - "55432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U foundgine -d foundgine_e2e"]
      interval: 2s
      timeout: 5s
      retries: 30
      start_period: 3s
    tmpfs:
      - /var/lib/postgresql/data
    restart: "no"
