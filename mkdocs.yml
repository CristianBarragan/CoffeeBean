site_name: Foundgine
site_description: "A small, provider-independent semantic execution engine for .NET."
repo_url: https://github.com/CristianBarragan/Foundgine
repo_name: CristianBarragan/Foundgine
docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: README.md
  - Product Identity: PRODUCT-IDENTITY.md
  - AI Capability Interface: AI-CAPABILITY-INTERFACE.md
  - Getting Started: GETTING-STARTED.md
  - Architecture: ARCHITECTURE.md
  - Architecture Boundaries: ARCHITECTURE-BOUNDARIES.md
  - Authorization Invariants: PRIORITY-3-AUTHORIZATION-INVARIANTS.md
  - Flagship Proof: FLAGSHIP-PROOF.md
  - Provider Independence: PROVIDER-INDEPENDENCE.md
  - Agent Semantic Boundary: AGENT-SEMANTIC-BOUNDARY.md
  - Authorization Golden Path: AUTHORIZATION-GOLDEN-PATH.md
  - Context-Safe Plan Caching: CONTEXT-SAFE-PLAN-CACHING.md
  - Execution Evidence: EVIDENCE.md
  - Current Status: CURRENT-STATUS.md
  - Documentation Truth: DOCUMENTATION-TRUTH.md
  - Runtime: RUNTIME.md
  - GraphQL: GRAPHQL.md
  - AOT: AOT.md
  - Testing: TESTING.md
  - Security: SECURITY.md
  - Migration: MIGRATION.md
  - Roadmap: ROADMAP.md
  - History: history/README.md

  - Priorities:
    - Mutation Simplification: PRIORITY-5-MUTATION-SIMPLIFICATION.md
