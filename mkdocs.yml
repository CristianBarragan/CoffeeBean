site_name: Foundgine
site_description: "Semantic execution layer for .NET"
repo_url: https://github.com/CristianBarragan/Foundgine
repo_name: CristianBarragan/Foundgine

theme:
  name: material
  features:
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: README.md
  - Getting started: GETTING-STARTED.md
  - Layer setup: LAYER-SETUP.md
  - What Foundgine is designed for: APPLICATION-CATEGORIES.md
  - Architecture: ARCHITECTURE.md
  - Lexical grounding: LEXICAL-GROUNDING.md
  - Grounding decisions: GROUNDING-DECISIONS.md
  - Product identity: PRODUCT-IDENTITY.md
  - Provider independence: PROVIDER-INDEPENDENCE.md
  - Security: SECURITY.md
  - Testing: TESTING.md
  - PostgreSQL E2E: POSTGRES-E2E.md
  - Current status: CURRENT-STATUS.md
  - AI boundary: AGENT-SEMANTIC-BOUNDARY.md
  - Authorization: AUTHORIZATION.md
  - Execution: EXECUTION-IR.md
  - GraphQL: GRAPHQL.md
  - AOT: AOT.md
  - Roadmap: ROADMAP.md
  - History: history/README.md
