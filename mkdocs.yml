site_name: Foundgine
site_description: "A small, provider-independent semantic execution engine for .NET."
repo_url: https://github.com/CristianBarragan/Foundgine
repo_name: CristianBarragan/Foundgine
docs_dir: docs
site_dir: site

theme:
  name: material
  features:
    - navigation.top
    - navigation.footer
    - search.suggest
    - search.highlight
    - content.code.copy

markdown_extensions:
  - admonition
  - pymdownx.details
  - pymdownx.superfences
  - pymdownx.highlight
  - tables
  - toc:
      permalink: true

plugins:
  - search

nav:
  - Home: README.md
  - Getting Started: GETTING-STARTED.md
  - Architecture: ARCHITECTURE.md
  - Current Status: CURRENT-STATUS.md
  - Runtime: RUNTIME.md
  - GraphQL: GRAPHQL.md
  - AOT: AOT.md
  - Testing: TESTING.md
  - Security: SECURITY.md
  - Migration: MIGRATION.md
  - Roadmap: ROADMAP.md
  - History: history/README.md
