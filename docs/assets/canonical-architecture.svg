<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="1120" viewBox="0 0 1400 1120" role="img" aria-labelledby="title desc">
<title id="title">Foundgine canonical architecture</title>
<desc id="desc">Caller to intent, semantic model, semantic operation graph, retrieval, resolution, authorization, plan binding, execution IR, provider, execution and evidence. Retrieval uses parallel relational, fuzzy pg_trgm, full text tsvector, optional BM25 pg_search, optional Apache AGE graph and other strategies, producing candidates and evidence that flow into resolution.</desc>
<rect width="1400" height="1120" fill="#fff"/>
<text x="700" y="48" text-anchor="middle" font-family="Arial, sans-serif" font-size="30" font-weight="700" fill="#17132b">Foundgine — Canonical Architecture</text>
<text x="700" y="78" text-anchor="middle" font-family="Arial, sans-serif" font-size="16" fill="#5b5870">One semantic lifecycle · one authorization boundary · many interfaces · many retrieval strategies</text>

<defs>
 <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#55506a"/></marker>
 <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="2" stdDeviation="3" flood-opacity="0.12"/></filter>
</defs>

<!-- main pipeline -->
<g font-family="Arial, sans-serif">
 <g filter="url(#shadow)">
  <rect x="70" y="120" width="430" height="56" rx="10" fill="#f3efff" stroke="#6d45c5"/><text x="285" y="155" text-anchor="middle" font-size="20" font-weight="700" fill="#35215f">1 · Caller</text>
  <rect x="70" y="205" width="430" height="56" rx="10" fill="#f3efff" stroke="#6d45c5"/><text x="285" y="240" text-anchor="middle" font-size="20" font-weight="700" fill="#35215f">2 · Intent</text>
  <rect x="70" y="290" width="430" height="56" rx="10" fill="#eef8fb" stroke="#27879b"/><text x="285" y="325" text-anchor="middle" font-size="20" font-weight="700" fill="#175764">3 · Semantic Model</text>
  <rect x="70" y="375" width="430" height="56" rx="10" fill="#eef9ef" stroke="#4a9b58"/><text x="285" y="410" text-anchor="middle" font-size="20" font-weight="700" fill="#245d2d">4 · Semantic Operation Graph</text>
  <rect x="70" y="540" width="430" height="56" rx="10" fill="#fff5e8" stroke="#d78a18"/><text x="285" y="575" text-anchor="middle" font-size="20" font-weight="700" fill="#80500c">5 · Retrieval</text>
  <rect x="70" y="705" width="430" height="56" rx="10" fill="#fff0f0" stroke="#c84c4c"/><text x="285" y="740" text-anchor="middle" font-size="20" font-weight="700" fill="#7a2424">7 · Authorization</text>
  <rect x="70" y="790" width="430" height="56" rx="10" fill="#f4efff" stroke="#7453c8"/><text x="285" y="825" text-anchor="middle" font-size="20" font-weight="700" fill="#432b78">8 · Plan Binding</text>
  <rect x="70" y="875" width="430" height="56" rx="10" fill="#f0f5ff" stroke="#4475b8"/><text x="285" y="910" text-anchor="middle" font-size="20" font-weight="700" fill="#234c7d">9 · Execution IR</text>
  <rect x="70" y="960" width="430" height="56" rx="10" fill="#eef7ff" stroke="#3d7bb4"/><text x="285" y="995" text-anchor="middle" font-size="20" font-weight="700" fill="#204d76">10 · Provider</text>
  <rect x="70" y="1045" width="430" height="56" rx="10" fill="#edf9f3" stroke="#4d9c72"/><text x="285" y="1080" text-anchor="middle" font-size="20" font-weight="700" fill="#285f44">11 · Execution → 12 · Evidence</text>
 </g>
 <g stroke="#55506a" stroke-width="3" marker-end="url(#arrow)">
  <line x1="285" y1="176" x2="285" y2="205"/><line x1="285" y1="261" x2="285" y2="290"/><line x1="285" y1="346" x2="285" y2="375"/>
  <line x1="285" y1="431" x2="285" y2="540"/><line x1="285" y1="596" x2="285" y2="705"/><line x1="285" y1="761" x2="285" y2="790"/><line x1="285" y1="846" x2="285" y2="875"/><line x1="285" y1="931" x2="285" y2="960"/><line x1="285" y1="1016" x2="285" y2="1045"/>
 </g>
 <text x="285" y="492" text-anchor="middle" font-size="14" fill="#6b687a">discover candidates</text>
 <text x="285" y="660" text-anchor="middle" font-size="14" fill="#6b687a">candidates + evidence → resolution</text>
 <rect x="70" y="625" width="430" height="56" rx="10" fill="#fff9ee" stroke="#d78a18"/><text x="285" y="660" text-anchor="middle" font-size="20" font-weight="700" fill="#80500c">6 · Resolution</text>
 <line x1="285" y1="596" x2="285" y2="625" stroke="#55506a" stroke-width="3" marker-end="url(#arrow)"/>
 <line x1="285" y1="681" x2="285" y2="705" stroke="#55506a" stroke-width="3" marker-end="url(#arrow)"/>

 <!-- retrieval panel -->
 <rect x="590" y="285" width="740" height="395" rx="16" fill="#fffaf1" stroke="#d78a18" stroke-width="2" filter="url(#shadow)"/>
 <text x="960" y="320" text-anchor="middle" font-size="22" font-weight="700" fill="#80500c">Retrieval strategies are parallel</text>
 <text x="960" y="347" text-anchor="middle" font-size="14" fill="#6b5b3e">They discover candidates; they never grant authority</text>
 <g>
  <rect x="620" y="380" width="125" height="80" rx="10" fill="#fff" stroke="#b9a477"/><text x="682" y="408" text-anchor="middle" font-size="15" font-weight="700">Relational</text><text x="682" y="432" text-anchor="middle" font-size="13" fill="#5b5870">structured</text><text x="682" y="450" text-anchor="middle" font-size="13" fill="#5b5870">queries</text>
  <rect x="765" y="380" width="125" height="80" rx="10" fill="#fff" stroke="#b9a477"/><text x="827" y="408" text-anchor="middle" font-size="15" font-weight="700">Fuzzy</text><text x="827" y="432" text-anchor="middle" font-size="13" fill="#5b5870">pg_trgm</text>
  <rect x="910" y="380" width="125" height="80" rx="10" fill="#fff" stroke="#b9a477"/><text x="972" y="408" text-anchor="middle" font-size="15" font-weight="700">FullText</text><text x="972" y="432" text-anchor="middle" font-size="13" fill="#5b5870">tsvector</text>
  <rect x="1055" y="380" width="125" height="80" rx="10" fill="#fff" stroke="#b9a477"/><text x="1117" y="408" text-anchor="middle" font-size="15" font-weight="700">BM25</text><text x="1117" y="432" text-anchor="middle" font-size="13" fill="#5b5870">pg_search</text>
  <rect x="1200" y="380" width="100" height="80" rx="10" fill="#fff" stroke="#b9a477"/><text x="1250" y="408" text-anchor="middle" font-size="15" font-weight="700">AGE Graph</text><text x="1250" y="432" text-anchor="middle" font-size="13" fill="#5b5870">Apache AGE</text>
 </g>
 <g stroke="#9b8451" stroke-width="2.5" marker-end="url(#arrow)">
  <line x1="682" y1="460" x2="682" y2="520"/><line x1="827" y1="460" x2="827" y2="520"/><line x1="972" y1="460" x2="972" y2="520"/><line x1="1117" y1="460" x2="1117" y2="520"/><line x1="1250" y1="460" x2="1250" y2="520"/>
 </g>
 <rect x="690" y="535" width="540" height="88" rx="12" fill="#fff" stroke="#d78a18" stroke-width="2"/>
 <text x="960" y="570" text-anchor="middle" font-size="19" font-weight="700" fill="#80500c">Candidates + Evidence</text><text x="960" y="596" text-anchor="middle" font-size="14" fill="#6b687a">ranked/provenance-carrying results</text>
 <line x1="500" y1="568" x2="690" y2="568" stroke="#9b8451" stroke-width="3" marker-end="url(#arrow)"/>

 <!-- invariants -->
 <rect x="590" y="720" width="740" height="300" rx="16" fill="#f8f7fc" stroke="#aaa6ba"/>
 <text x="960" y="755" text-anchor="middle" font-size="22" font-weight="700" fill="#302d40">Non-negotiable invariants</text>
 <text x="625" y="805" font-size="16" font-weight="700" fill="#302d40">• Retrieval is not authorization.</text>
 <text x="625" y="840" font-size="16" font-weight="700" fill="#302d40">• The operation graph is resolved before provider planning.</text>
 <text x="625" y="875" font-size="16" font-weight="700" fill="#302d40">• Authorization is bound to the executable plan.</text>
 <text x="625" y="910" font-size="16" font-weight="700" fill="#302d40">• Provider optimization cannot remove security obligations.</text>
 <text x="625" y="945" font-size="16" font-weight="700" fill="#302d40">• Final execution fails closed when provenance/conformance fails.</text>
 <text x="625" y="980" font-size="16" font-weight="700" fill="#302d40">• Evidence records what happened; it does not grant authority.</text>
</g>
</svg>